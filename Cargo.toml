[workspace]
resolver = "2"
members = [
    "crates/community-core",
    "crates/community-protocol",
    "crates/community-security",
    "crates/community-governor",
    "crates/community-model-manager",
    "crates/community-runtime",
    "crates/community-scheduler",
    "crates/community-network",
    "crates/community-daemon",
    "crates/community-simulator",
    "crates/community-ffi",
    "crates/community-app",
    "crates/community-storage",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Community AI Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bytes = "1.7"
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
blake3 = { version = "1.5", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
sysinfo = "0.31"
clap = { version = "4.5", features = ["derive", "env"] }
quinn = { version = "0.11", features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = "0.13"
rustls-pki-types = "1"
mdns-sd = "0.11"
if-addrs = "0.13"
hex = "0.4"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"

# Internal workspace crates
community-core = { path = "crates/community-core" }
community-storage = { path = "crates/community-storage" }
community-protocol = { path = "crates/community-protocol" }
community-security = { path = "crates/community-security" }
community-governor = { path = "crates/community-governor" }
community-model-manager = { path = "crates/community-model-manager" }
community-runtime = { path = "crates/community-runtime" }
community-scheduler = { path = "crates/community-scheduler" }
community-network = { path = "crates/community-network" }
community-app = { path = "crates/community-app" }
