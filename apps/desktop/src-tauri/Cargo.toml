[package]
name = "community-desktop"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "community_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
community-app = { path = "../../../crates/community-app" }
community-network = { path = "../../../crates/community-network" }
