<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Community AI</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 2rem; }
      h1 { color: #ff7a00; }
      code { color: #ffb36b; }
    </style>
  </head>
  <body>
    <h1>Community AI</h1>
    <p>Native desktop shell over the Rust QUIC core. This is not a browser mesh.</p>
    <p>Peer ID: <code id="peer">starting…</code></p>
    <script>
      async function load() {
        try {
          const { invoke } = window.__TAURI__.core;
          const id = await invoke("peer_id");
          document.getElementById("peer").textContent = id;
        } catch (e) {
          document.getElementById("peer").textContent =
            "Tauri IPC unavailable (open via `npx tauri dev`)";
        }
      }
      load();
    </script>
  </body>
</html>
